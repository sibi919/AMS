# Serves the built SPA. SPA fallback for /login, /reset-password and /portal/*,
# with normal 404 behaviour retained for asset paths, as docs/SETUP.md requires.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Hashed build assets: real 404 when missing, long cache when present.
    location /assets/ {
        try_files $uri =404;
        # `expires` emits Cache-Control without add_header, so the security
        # headers declared at server level are still inherited here.
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }
}
